<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo 9:16</title>
<style>
  /* Reset básico */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: "Segoe UI", sans-serif;
    background: linear-gradient(180deg, #0f0f0f 0%, #1a1a1a 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 15px;
    min-height: 100vh;
  }

  header {
    text-align: center;
    margin-bottom: 20px;
  }

  header h1 {
    font-size: 2rem;
    letter-spacing: 1px;
    margin-bottom: 5px;
    color: #f5f5f5;
  }

  header p {
    color: #aaa;
    font-size: 1rem;
  }

  .gallery {
    display: flex;
    flex-direction: column;
    gap: 20px;
    width: 100%;
    max-width: 500px;
  }

  .item {
    position: relative;
    width: 100%;
    aspect-ratio: 9 / 16;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    background: #222;
  }

  .item:hover {
    transform: scale(1.03);
    box-shadow: 0 12px 28px rgba(0,0,0,0.7);
  }

  .item img, .item video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Pequeño overlay para videos */
  .item video {
    transition: filter 0.3s ease;
  }

  /* Scroll suavizado */
  html {
    scroll-behavior: smooth;
  }

  @media (max-width: 400px) {
    header h1 {
      font-size: 1.5rem;
    }
    header p {
      font-size: 0.9rem;
    }
  }
</style>
</head>
<body>

<header>
  <h1>📸 Yudaily Diaz</h1>
  <p>215 000 visitas 👁️</p>
</header>

<div class="gallery">
  <div class="item">
    <video src="Fotos/Yudaily9.mp4" playsinline muted loop autoplay></video>
  </div>
  
  
  <div class="item">
    <video src="Fotos/Yudaily6.mp4" playsinline muted loop autoplay></video>
  </div>

  <div class="item">
    <video src="Fotos/Yudaily7.mp4" playsinline muted loop autoplay></video>
  </div>ç
  
  <div class="item">
    <img src="Fotos/Yudaily1.jpg" alt="Foto 1">
  </div>

  <div class="item">
    <img src="Fotos/Yudaily2.jpg" alt="Foto 2">
  </div>

  <div class="item">
    <img src="Fotos/Yudaily3.jpg" alt="Foto 3">
  </div>

  <div class="item">
    <img src="Fotos/Yudaily4.jpg" alt="Foto 4">
  </div>

  <div class="item">
    <img src="Fotos/Yudaily5.jpg" alt="Foto 5">
  </div>


  <div class="item">
    <video src="Fotos/Yudaily8.mp4" playsinline muted loop autoplay></video>
  </div>
</div>

<script>
  // Auto play solo el video que está visible en pantalla
  const videos = document.querySelectorAll('video');

  const options = {
    root: null,
    rootMargin: '0px',
    threshold: 0.5
  }

  const handlePlay = (entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.play();
      } else {
        entry.target.pause();
      }
    });
  }

  const observer = new IntersectionObserver(handlePlay, options);

  videos.forEach(video => {
    observer.observe(video);
  });
</script>

</body>
</html>
